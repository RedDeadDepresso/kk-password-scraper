name: Deploy passwords to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - .github/workflows/pages.yml
  # Pushes made with GITHUB_TOKEN don't trigger other workflows,
  # so deploy explicitly after the scrape workflow finishes.
  workflow_run:
    workflows: ["Scrape passwords"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run checks out the default branch by default; pin explicitly
          # so we always deploy the branch the scrape workflow just updated.
          ref: main

      - name: Build kk_password_index.json ({"filename":["password"]})
        run: |
          mkdir -p _site
          if ls data/*.json >/dev/null 2>&1; then
            # -s = slurp all files into one array, add = concatenate the arrays.
            # Each filename maps to a list of distinct passwords, in source order
            # (the data files are newest-first). Entries without a password are dropped.
            # -c = compact output (no indentation).
            jq -s -c '(add // []) | map(select(.password != "")) | reduce .[] as $e ({}; if any(.[$e.filename][]?; . == $e.password) then . else .[$e.filename] += [$e.password] end)' data/*.json > _site/kk_password_index.json
          else
            echo '{}' > _site/kk_password_index.json
          fi
          echo "Generated $(jq 'length' _site/kk_password_index.json) entries"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4